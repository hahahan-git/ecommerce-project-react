<!DOCTYPE html>
<html>

<head>
  <title>lesson 1 exercises - react basics jsx</title>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">
    const name = "Reyhan";
    const button = <button>Good Job!</button>;
    const paragraph = <p>My name is {name}</p>;
    const card = (
      <div>
        <p>Cotton socks</p>
        <p>Price: ${10}</p>
        <button>Add to Cart</button>
      </div>
    );

    const packSocks = 10;
    const tShirt = 8;
    const shippingCost = 5;
    const productCost = packSocks + (2 * tShirt);
    const totalCost = productCost + shippingCost;
    const date = dayjs();


    const div = (
      <div>
        {button}
        {paragraph}
        {card}
        <p>Product cost: ${productCost}</p>
        <p>Shipping cost: ${shippingCost}</p>
        <p>Total cost: ${totalCost}</p>
        <button>Place your order</button>
        <div>Today is {date.format('MMMM D')}</div>
        <div>Current time {date.format('HH:mm:ss')}</div>
      </div>
    );


    function clock() {
      const isclock = (
        <div>
          Current time {dayjs().format('HH:mm:ss')}
        </div>
      );
      root.render(isclock);
    }

    const container = document.querySelector('.js-container');
    const root = ReactDOM.createRoot(container);

    setInterval(() => {
      clock();
    }, 1000);


  </script>


</body>

</html>
